name: fireguard
description: A responsive BLE firefighter robot companion with Firebase telemetry.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.4.2
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
